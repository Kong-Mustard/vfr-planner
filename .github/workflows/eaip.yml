# ดึงข้อมูล eAIP Thailand อัตโนมัติ → eaip_data.json (แอปโหลดเองตอนเปิด)
name: Update eAIP

on:
  schedule:
    - cron: "17 2 */5 * *"   # ทุก 5 วัน 09:17 น. เวลาไทย (การอัปเดต eAIP ไม่ตายตัว)
  workflow_dispatch:        # กดรันเองได้ที่แท็บ Actions
  push:                     # รันทันทีเมื่อแก้สคริปต์
    paths:
      - eaip_update.py
      - .github/workflows/eaip.yml

concurrency: { group: data-commit, cancel-in-progress: false }
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python eaip_update.py
      - name: Commit ถ้าข้อมูลเปลี่ยน
        run: |
          git config user.name "eaip-bot"
          git config user.email "eaip-bot@users.noreply.github.com"
          git add eaip_data.json
          git diff --cached --quiet || git commit -m "อัปเดตข้อมูล eAIP อัตโนมัติ"
          git pull --rebase -X theirs
          git push
