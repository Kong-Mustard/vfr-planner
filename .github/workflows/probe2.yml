name: Probe 2 (temporary)
on: { push: { paths: [probe2.py, .github/workflows/probe2.yml] } }
permissions: { contents: read }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 && sudo apt-get install -y poppler-utils tesseract-ocr >/dev/null
      - run: python probe2.py
