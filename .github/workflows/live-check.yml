name: live-check (ชั่วคราว — ตรวจหน้าเว็บจริงหลังเพิ่ม SRI)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm i playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const {chromium}=require('playwright');(async()=>{const b=await chromium.launch();const p=await b.newPage();const errs=[];
          p.on('pageerror',e=>errs.push('PAGE '+e.message));p.on('console',m=>{if(m.type()==='error')errs.push('CON '+m.text())});
          await p.goto('https://kong-mustard.github.io/vfr-planner/?v='+Date.now(),{waitUntil:'networkidle'});await p.waitForTimeout(4000);
          const r=await p.evaluate(()=>({L:typeof L,mgrs:typeof mgrs,ver:document.querySelector('script[integrity]')?.src,wps:typeof state==='object'&&state.wps.length,tiles:document.querySelectorAll('.leaflet-tile-loaded').length}));
          const r2=await p.evaluate(async()=>{try{await loadLib("https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js","PDFLib");await loadScript("https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js");await loadLib("https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js","htmlToImage");await loadLib("https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js","lottie");await loadML();return [typeof PDFLib,typeof ExcelJS,typeof htmlToImage,typeof lottie,typeof maplibregl].join(",")}catch(e){return "ERR "+e}});
          console.log('RESULT',JSON.stringify(r),r2);console.log('ERRS',JSON.stringify(errs));await b.close()})();
          JS
          node t.js
