name: Probe NOTAM
on:
  push:
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          {
          echo "== DINS raw VTBD VTBB"; curl -s -A "$UA" "https://www.notams.faa.gov/dinsQueryWeb/queryRetrievalMapAction.do?reportType=Raw&retrieveLocId=VTBD+VTBB&actionType=notamRetrievalByICAOs&submit=View+NOTAMs" | sed 's/<[^>]*>//g' | grep -v "^\s*$" | head -40
          echo "== FAA search UA"; curl -s -A "$UA" -H "Referer: https://notams.aim.faa.gov/notamSearch/" -H "X-Requested-With: XMLHttpRequest" -X POST "https://notams.aim.faa.gov/notamSearch/search" --data "searchType=0&designatorsForLocation=VTBD&offset=0&notamsOnly=false" | head -c 1200; echo
          } > probe_result.txt 2>&1
          git config user.name "eaip-bot"; git config user.email "eaip-bot@users.noreply.github.com"
          git add -f probe_result.txt; git commit -m "probe" || true; git pull --rebase; git push
