name: Probe AD 2.24 (temporary)
on: { workflow_dispatch: {} , push: { paths: [probe_ad224.py, .github/workflows/probe.yml] } }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 && sudo apt-get install -y poppler-utils >/dev/null
      - run: python probe_ad224.py
      - uses: actions/upload-artifact@v4
        with: { name: probe, path: probe/, retention-days: 2 }
