# ทดสอบชั่วคราว: เช็คว่าแหล่งข้อมูลอากาศ/NOTAM อนุญาตให้เว็บแอปดึงตรง (CORS) ได้ไหม
name: Probe sources
on:
  push:
    paths: [.github/workflows/probe.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          O="Origin: https://kong-mustard.github.io"
          {
          echo "== aviationweather metar"; curl -s -o /dev/null -D - -H "$O" "https://aviationweather.gov/api/data/metar?ids=VTBD,VTPP&format=json" | grep -i -E "^HTTP|access-control"
          curl -s -H "$O" "https://aviationweather.gov/api/data/metar?ids=VTBD,VTPP&format=json" | head -c 600; echo
          echo "== aviationweather taf"; curl -s -H "$O" "https://aviationweather.gov/api/data/taf?ids=VTBD&format=json" | head -c 400; echo
          echo "== open-meteo"; curl -s -o /dev/null -D - -H "$O" "https://api.open-meteo.com/v1/forecast?latitude=14,15&longitude=100,101&hourly=wind_speed_850hPa&models=ecmwf_ifs025" | grep -i -E "^HTTP|access-control"
          echo "== rainviewer"; curl -s -D - -H "$O" "https://api.rainviewer.com/public/weather-maps.json" | grep -i -E "^HTTP|access-control" ; curl -s "https://api.rainviewer.com/public/weather-maps.json" | head -c 300; echo
          echo "== faa notam search"; curl -s -o /tmp/n.txt -D - -H "$O" -X POST "https://notams.aim.faa.gov/notamSearch/search" -d "searchType=0&designatorsForLocation=VTBD&offset=0&notamsOnly=false" | grep -i -E "^HTTP|access-control|content-type"; head -c 800 /tmp/n.txt; echo
          echo "== faa notam VTBB"; curl -s -X POST "https://notams.aim.faa.gov/notamSearch/search" -d "searchType=0&designatorsForLocation=VTBB&offset=0&notamsOnly=false" | head -c 600; echo
          } > probe_result.txt 2>&1
          git config user.name "eaip-bot"; git config user.email "eaip-bot@users.noreply.github.com"
          git add probe_result.txt; git commit -m "probe result" || true; git pull --rebase; git push
