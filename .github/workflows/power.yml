# ดึงแนวสายส่งไฟฟ้าแรงสูง (power=line) ในไทยจาก OpenStreetMap เดือนละครั้ง → power_data.json
# ใช้ไฟล์ OSM ประเทศไทยของ Geofabrik (อัปเดตรายวัน) แล้วกรองด้วย osmium — เสถียรกว่า Overpass
# ข้อมูล © OpenStreetMap contributors (ODbL) — ไม่ครบทุกพื้นที่ โดยเฉพาะป่า/ภูเขา และสาย 22–33 kV ส่วนใหญ่ไม่มี
name: Update power lines (OSM)
on:
  schedule:
    - cron: "23 2 3 * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/power.yml]
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  power:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download Thailand extract + filter power lines
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y osmium-tool
          curl -fsSL --retry 5 --retry-delay 20 -o /tmp/th.pbf https://download.geofabrik.de/asia/thailand-latest.osm.pbf
          ls -la /tmp/th.pbf
          osmium tags-filter /tmp/th.pbf w/power=line -o /tmp/pw.pbf --overwrite
          osmium export /tmp/pw.pbf -f geojsonseq -o /tmp/pw.geojsonseq --overwrite --geometry-types=linestring
          python3 - <<'PY'
          import json, re, datetime
          def kv(t):
              n = [int(x) for x in re.findall(r"\d{4,7}", str(t.get("voltage", "")))]
              return round(max(n) / 1000) if n else None
          lines = []
          for raw in open("/tmp/pw.geojsonseq", encoding="utf-8"):
              raw = raw.strip().lstrip("\x1e")
              if not raw: continue
              f = json.loads(raw); g = f.get("geometry") or {}
              if g.get("type") != "LineString" or len(g.get("coordinates", [])) < 2: continue
              t = f.get("properties") or {}
              if t.get("power") != "line": continue
              lines.append({"v": kv(t), "n": (t.get("name") or t.get("ref") or "")[:40], "o": (t.get("operator") or "")[:20],
                            "c": [[round(c[1], 5), round(c[0], 5)] for c in g["coordinates"]]})
          out = {"fetched": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%MZ"), "source": "OpenStreetMap contributors (ODbL) via Geofabrik",
                 "note": "power=line เท่านั้น · ไม่ครบทุกพื้นที่ · ไม่มีความสูงเสา", "lines": lines}
          json.dump(out, open("power_data.json", "w"), separators=(",", ":"))
          print(len(lines), "lines,", sum(len(l["c"]) for l in lines), "vertices")
          PY
          ls -la power_data.json
      - name: Commit
        run: |
          git config user.name "eaip-bot"; git config user.email "eaip-bot@users.noreply.github.com"
          git add power_data.json
          git diff --cached --quiet || git commit -m "อัปเดตแนวสายส่งไฟฟ้า (OSM)"
          git pull --rebase -X theirs; git push
